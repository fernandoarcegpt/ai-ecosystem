name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run core acceptance suite
        env:
          PYTHONPATH: .:./skilled
        run: >-
          python -m pytest -q
          skilled/reasoning/test_neuro_symbolic_system.py
          tests/test_neurosymbolic_corrected.py
          tests/test_neurosymbolic_acceptance.py
          tests/test_task_execution.py
          tests/test_semantic_router/test_core_modes.py
          skills/reasoning/hermes-symbolic-integration/test_symbolic_integration.py
          test_neurosymbolic.py
          skilled/reasoning/test_integration.py
